# Pipeline sugerido para la sesión de laboratorio
# Triggers: se dispara en `push` y `pull_request`.
# Quality gate (valores mínimos aceptables):
# - coverage: 80% (razón: balance entre seguridad y costo de mantenimiento. Asegura pruebas significativas sin exigir 100%.)
# - mutation score: 70% (razón: refleja la capacidad de las pruebas para detectar cambios no triviales.)
# Estas cifras deben discutirse por equipo; aquí son umbrales mínimos recomendados.

name: CI - Tests & Quality

on:
  push:
    branches: ["main", "master"]
    tags:
      - 'v*'
  pull_request:
    branches: ["main", "master"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run linter (flake8)
        run: flake8 . --exit-zero --count --statistics

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install package
        run: pip install -r requirements.txt

  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q -k "not integration" --maxfail=1

  integration_tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run integration tests
        run: pytest -q -m integration --maxfail=1

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    needs: integration_tests
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run coverage
        run: |
          coverage run -m pytest
          coverage xml -i
          coverage report -m
      - name: Enforce coverage threshold
        run: |
          COVERAGE_PERCENT=$(coverage report | tail -n 1 | awk '{print $4}' | sed 's/%//') || true
          echo "Coverage percent: $COVERAGE_PERCENT"
          if [ -z "$COVERAGE_PERCENT" ] || [ "$(echo "$COVERAGE_PERCENT < 80" | bc)" -eq 1 ]; then
            echo "Coverage threshold not met: $COVERAGE_PERCENT% < 80%"; exit 1
          fi

  mutation_stryker:
    name: Mutation & Stryker
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
      # ── Backend: mutmut ──────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Python deps
        run: pip install -r requirements.txt
      - name: Run mutation tests (mutmut)
        run: |
          pip install "mutmut<3"
          mutmut run || true
          echo "=== Mutmut survived mutations ==="
          mutmut results 2>&1 || true
          python3 scripts/check_mutmut_score.py
      # ── Frontend: Stryker ────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install frontend dependencies
        run: cd frontend && npm ci
      - name: Run Stryker (frontend mutation)
        run: cd frontend && npm run stryker
      - name: Upload Stryker reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stryker-reports
          path: frontend/reports/mutation
          
  registro_cambios:
    name: Registro de cambios aprobados
    runs-on: ubuntu-latest
    needs: mutation_stryker
    if: github.event_name == 'push' && contains(fromJSON('["refs/heads/main","refs/heads/master"]'), github.ref)
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obtener PR asociada al commit
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          PR_JSON=$(gh api repos/${{ github.repository }}/commits/$SHA/pulls | jq '.[0]')
          if [ "$PR_JSON" == "null" ] || [ -z "$PR_JSON" ]; then
            echo "No se encontró PR asociada (push directo a la rama)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "$PR_JSON" > pr.json
          echo "number=$(jq -r '.number' pr.json)" >> "$GITHUB_OUTPUT"

      - name: Armar entrada de log
        if: steps.pr_info.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ steps.pr_info.outputs.number }}
          REPO=${{ github.repository }}

          AUTHOR=$(jq -r '.user.login' pr.json)
          TITLE=$(jq -r '.title' pr.json)
          MERGED_AT=$(jq -r '.merged_at' pr.json)
          URL=$(jq -r '.html_url' pr.json)

          REVIEWERS=$(gh api repos/$REPO/pulls/$PR_NUM/reviews \
            | jq -r '[.[] | select(.state=="APPROVED") | .user.login] | unique | join(",")')

          COMMITS=$(gh api repos/$REPO/pulls/$PR_NUM/commits \
            | jq -r '[.[].sha[0:7]] | join(",")')

          # Si llegamos hasta este job, el quality gate (coverage + mutation) pasó
          CHECK_RESULT="passed"

          ENTRY=$(jq -nc \
            --arg date "$MERGED_AT" --arg pr "$PR_NUM" --arg title "$TITLE" \
            --arg author "$AUTHOR" --arg reviewers "$REVIEWERS" \
            --arg commits "$COMMITS" --arg result "$CHECK_RESULT" \
            --arg url "$URL" --arg sha "${{ github.sha }}" \
            '{date:$date, pr:$pr, title:$title, author:$author, reviewers:$reviewers,
              commits:$commits, check_result:$result, sha:$sha, url:$url}')

          mkdir -p logs
          echo "$ENTRY" >> logs/approved_changes.jsonl

      - name: Commitear log actualizado
        if: steps.pr_info.outputs.skip != 'true'
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git add logs/approved_changes.jsonl
          git diff --cached --quiet && echo "Sin cambios" || \
            git commit -m "chore(log): registrar PR #${{ steps.pr_info.outputs.number }} [skip ci]"
          git push
