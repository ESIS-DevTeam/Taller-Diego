# ========================================
# ArgoCD Application — Pipeline GitOps del Taller de Diego
# El repositorio Git es la única fuente de verdad:
# targetRevision apunta a la ETIQUETA FIRMADA del release,
# nunca a una rama móvil.
#
# Aplicar:    kubectl apply -f deploy/argocd/application.yaml
# Sincronizar: argocd app sync taller-diego
# Rollback:    argocd app rollback taller-diego
# ========================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taller-diego
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ESIS-DevTeam/Taller-Diego.git
    # Release desplegado: SIEMPRE una etiqueta firmada (SemVer), no una rama
    targetRevision: v1.2.0
    path: deploy/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: taller-diego
  syncPolicy:
    # Reconciliación automática (S15/S16): el clúster converge SIEMPRE al
    # estado declarado en Git. Cualquier cambio manual en caliente
    # (kubectl edit/scale) es detectado como drift y revertido de inmediato.
    automated:
      selfHeal: true   # autocuración: revierte drift sin intervención humana
      prune: true      # elimina recursos que ya no están declarados en Git
    syncOptions:
      - CreateNamespace=true
    # La promoción de un release sigue siendo una decisión explícita y
    # auditable (IEEE 828-2012): requiere un commit que cambie targetRevision
    # a una nueva etiqueta firmada. selfHeal no promueve versiones, solo
    # garantiza la inmutabilidad del estado declarado.
