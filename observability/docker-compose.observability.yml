# ========================================
# Stack de observabilidad SRE — Taller de Diego (Semana 14)
# Levanta: backend instrumentado + Prometheus + Grafana + Alertmanager
#
# Uso:
#   docker compose -f observability/docker-compose.observability.yml up -d
#
# Accesos:
#   Backend /metrics  → http://localhost:8000/metrics
#   Prometheus        → http://localhost:9090
#   Grafana           → http://localhost:3000  (admin / admin)
#   Alertmanager      → http://localhost:9093
# ========================================
services:
  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: taller-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: taller-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: taller-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    container_name: taller-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
